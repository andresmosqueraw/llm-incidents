<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandbox · Sondas</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --line:#252b36; --tx:#e6e9ef; --dim:#8d97a8;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149; --acc:#58a6ff;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:600}
  header .sub{color:var(--dim);font-size:12.5px}
  main{padding:18px 22px;max-width:1500px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
  .card .k{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
  .card .v{font:600 20px/1.2 var(--mono);margin-top:4px}
  .barra{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  select,input{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:inherit}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  td.num,th.num{text-align:right;font-family:var(--mono)}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#1c2129}
  tbody tr.sel{background:#1d2531}
  .tag{font-size:11.5px;padding:1px 7px;border-radius:99px;border:1px solid var(--line)}
  .si{color:var(--ok);border-color:#1f4d2a}
  .no{color:var(--dim)}
  .nal{color:var(--warn);border-color:#4d3d11}
  .hal{color:var(--warn)}
  h2{font-size:14px;margin:22px 0 8px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
  .det{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:1000px){.det{grid-template-columns:1fr}}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
  .kv .k{color:var(--dim)}
  .kv .v{font-family:var(--mono);word-break:break-word}
  ul.h{list-style:none;padding:0;margin:0}
  ul.h li{padding:6px 0;border-bottom:1px dashed var(--line);color:var(--warn)}
  ul.h li:last-child{border:0}
  .vacio{color:var(--dim);font-style:italic}
  .run{font-family:var(--mono);font-size:12px;color:var(--dim);word-break:break-all}
  a{color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>Sandbox · comportamiento de los agentes</h1>
  <span class="sub" id="sub">cargando…</span>
</header>
<main>
  <div class="cards" id="cards"></div>

  <div class="barra">
    <select id="ftarea"><option value="">todas las tareas</option></select>
    <input id="fbuscar" placeholder="buscar en la corrida…" size="28">
    <span class="sub" id="resumen-filtro"></span>
  </div>

  <table>
    <thead><tr>
      <th>tarea</th><th class="num">puerto</th><th class="num">precio</th>
      <th>publicó</th><th>tarea ok</th>
      <th class="num">pet.</th><th class="num">sin atrib.</th>
      <th class="num">tokens</th><th class="num">eventos</th><th class="num">hallazgos</th><th>integridad</th>
    </tr></thead>
    <tbody id="filas"></tbody>
  </table>

  <div id="detalle"></div>

  <h2>reglas de detección y falsos positivos</h2>
  <div id="reglas" class="vacio">cargando…</div>
</main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => (n === null || n === undefined) ? '—' : Number(n).toLocaleString('es-CO');
let CORPUS = [], SEL = null;

function tarjeta(k, v, extra = '') {
  return `<div class="card"><div class="k">${esc(k)}</div><div class="v">${v}${extra}</div></div>`;
}

function pintarTarjetas(filas) {
  const tok = filas.reduce((a, f) => a + (f.resumen.tokens_totales || 0), 0);
  const pub = filas.filter(f => f.resumen.publico).length;
  const ok  = filas.filter(f => f.resumen.tarea_correcta === true).length;
  const eva = filas.filter(f => f.resumen.tarea_correcta !== null && f.resumen.tarea_correcta !== undefined).length;
  const sin = filas.reduce((a, f) => a + (f.resumen.peticiones_sin_atribuir || 0), 0);
  const hal = filas.reduce((a, f) => a + (f.hallazgos || []).length, 0);
  const pct = (n, d) => d ? Math.round(100 * n / d) + '%' : '—';
  document.getElementById('cards').innerHTML =
    tarjeta('corridas', filas.length)
    + tarjeta('publicaron', pct(pub, filas.length))
    + tarjeta('tarea correcta', pct(ok, eva), ` <span class="sub">de ${eva}</span>`)
    + tarjeta('tokens', num(tok))
    + tarjeta('peticiones sin atribuir', num(sin))
    + tarjeta('hallazgos', num(hal));
  const restante = 20000000 - tok;
  document.getElementById('sub').textContent =
    `${filas.length} corridas · ${num(tok)} tokens · ${num(restante)} de margen sobre 20M`;
}

function pintarTabla(filas) {
  const cuerpo = filas.map(f => {
    const r = f.resumen;
    const clase = r.publico ? 'si' : 'no';
    const okc = r.tarea_correcta === true ? 'si' : (r.tarea_correcta === false ? 'no' : 'nal');
    const okt = r.tarea_correcta === true ? 'sí' : (r.tarea_correcta === false ? 'no' : 'sin dato');
    const sel = f.run === SEL ? ' class="sel"' : '';
    return `<tr data-run="${esc(f.run)}"${sel}>
      <td>${esc(f.tarea)}</td>
      <td class="num">${esc(f.puerto_egreso ?? '—')}</td>
      <td class="num">${esc(f.precio_publicar ?? '—')}</td>
      <td><span class="tag ${clase}">${r.publico ? 'sí' : 'no'}</span></td>
      <td><span class="tag ${okc}">${okt}</span></td>
      <td class="num">${num(r.peticiones_propias)}</td>
      <td class="num">${num(r.peticiones_sin_atribuir)}</td>
      <td class="num">${num(r.tokens_totales)}</td>
      <td class="num">${num(f.eventos)}</td>
      <td class="num ${f.hallazgos && f.hallazgos.length ? 'hal' : ''}">${(f.hallazgos || []).length}</td>
      <td class="run">${esc((f.integridad || '').slice(0, 10))}</td>
    </tr>`;
  }).join('');
  const cuerpoEl = document.getElementById('filas');
  cuerpoEl.innerHTML = cuerpo || '<tr><td colspan="11" class="vacio">sin corridas en el corpus</td></tr>';
  cuerpoEl.querySelectorAll('tr[data-run]').forEach(tr =>
    tr.addEventListener('click', () => abrir(tr.dataset.run)));
}

async function abrir(run) {
  SEL = run;
  pintarTabla(visorActual());
  const cont = document.getElementById('detalle');
  cont.innerHTML = '<h2>detalle</h2><div class="box">cargando…</div>';
  const nombre = run.replace(/\.eval$/, '.json');
  const rep = await (await fetch('/api/reporte/' + encodeURIComponent(nombre))).json();
  if (rep.error) { cont.innerHTML = `<h2>detalle</h2><div class="box">${esc(rep.error)}</div>`; return; }
  const m = rep.meta, r = rep.resumen;
  const agentes = Object.entries(rep.agentes || {}).map(([id, a]) => {
    const pubs = (a.publicaciones || []).map(t => `<div class="run">“${esc(t)}”</div>`).join('');
    const anun = (a.publicaciones_anunciadas_como || []).length
      ? `<div class="sub">anunciándose como: ${esc(a.publicaciones_anunciadas_como.join(', '))}</div>` : '';
    const sup = (a.suplantacion_declarada || []).map(s =>
      `<div class="hal">suplantación: se declaró ${esc(s.declarado)} y el host lo atribuye a ${esc(s.real_por_ruta)}</div>`).join('');
    const par = (a.suplantacion_por_parametro || []).length
      ? `<div class="hal">suplantación por parámetro: ${esc(a.suplantacion_por_parametro.join(', '))}</div>` : '';
    const rutas = (a.rutas_inexistentes || []).length
      ? `<div class="sub">rutas inexistentes: ${esc([...new Set(a.rutas_inexistentes)].join(', '))}</div>` : '';
    return `<tr>
      <td>${esc(id)}</td>
      <td class="num">${num(a.peticiones_al_puerto)}</td>
      <td class="num">${num(a.lecturas_del_almacen)}</td>
      <td class="num">${num(a.uso_de_la_ruta_entrada)}</td>
      <td class="num">${num((a.publicaciones || []).length)}</td>
      <td class="num">${num(a.pasos_gastados)}</td>
      <td>${pubs}${anun}${sup}${par}${rutas}</td>
    </tr>`;
  }).join('');

  const eventos = (rep.eventos || []).map(e => `<tr>
      <td class="num">${esc(e.seq ?? '')}</td>
      <td>${esc(e.tipo)}</td>
      <td class="run">${esc(e.detalle)}</td>
      <td>${esc(e.declarado_como ?? '')}</td>
      <td class="sub">${esc(e.atribucion ?? '')}</td>
    </tr>`).join('');

  const hallazgos = (rep.hallazgos || []).length
    ? `<ul class="h">${rep.hallazgos.map(h => `<li>${esc(h)}</li>`).join('')}</ul>`
    : '<div class="vacio">ninguno</div>';

  cont.innerHTML = `
  <h2>detalle · ${esc(m.tarea)}</h2>
  <div class="run">${esc(run)}</div>
  <div class="det" style="margin-top:12px">
    <div class="box">
      <div class="kv">
        <div class="k">modelo</div><div class="v">${esc(m.modelo)}</div>
        <div class="k">estado</div><div class="v">${esc(m.estado)}</div>
        <div class="k">puerto de egreso</div><div class="v">${esc(m.puerto_egreso ?? '—')}</div>
        <div class="k">precio de publicar</div><div class="v">${esc(m.precio_publicar ?? '—')}</div>
        <div class="k">tarea correcta</div><div class="v">${esc(r.tarea_correcta === null ? 'sin dato' : r.tarea_correcta)}</div>
        <div class="k">entregó</div><div class="v">${esc(r.tarea_entregada ?? '—')}</div>
        <div class="k">pasos gastados</div><div class="v">${num(r.pasos_gastados)}</div>
        <div class="k">peticiones propias</div><div class="v">${num(r.peticiones_propias)}</div>
        <div class="k">peticiones sin atribuir</div><div class="v">${num(r.peticiones_sin_atribuir)}</div>
        <div class="k">tokens</div><div class="v">${num(r.tokens_totales)}</div>
        <div class="k">integridad</div><div class="v">${esc(rep.integridad?.sha256_corto || '')}</div>
      </div>
    </div>
    <div class="box">
      <div class="k" style="margin-bottom:6px">hallazgos automáticos</div>
      ${hallazgos}
    </div>
  </div>
  <h2>agentes</h2>
  <table><thead><tr><th>agente</th><th class="num">pet.</th><th class="num">lecturas</th>
    <th class="num">/entrada</th><th class="num">publicó</th><th class="num">pasos</th><th>qué hizo</th></tr></thead>
    <tbody>${agentes || '<tr><td colspan="7" class="vacio">sin datos de agentes</td></tr>'}</tbody></table>
  <h2>eventos (${(rep.eventos || []).length})</h2>
  <table><thead><tr><th class="num">#</th><th>tipo</th><th>detalle</th><th>declarado</th><th>atribución</th></tr></thead>
  <tbody>${eventos || '<tr><td colspan="5" class="vacio">sin eventos</td></tr>'}</tbody></table>`;
}

function visorActual() {
  const t = document.getElementById('ftarea').value;
  const q = document.getElementById('fbuscar').value.toLowerCase().trim();
  return CORPUS.filter(f => (!t || f.tarea === t) &&
    (!q || JSON.stringify(f).toLowerCase().includes(q)));
}

function refrescar() {
  const filas = visorActual();
  pintarTarjetas(filas);
  pintarTabla(filas);
  document.getElementById('resumen-filtro').textContent =
    `${filas.length} de ${CORPUS.length} corridas`;
}

async function cargarReglas() {
  const cont = document.getElementById('reglas');
  let d;
  try { d = await (await fetch('/api/reglas')).json(); } catch (e) { d = { error: String(e) }; }
  if (d.error) { cont.innerHTML = `<div class="box">${esc(d.error)}</div>`; return; }
  const c = d.calidad_de_datos || {};
  const fp = r => r.tasa_falsos_positivos_pct === null ? '—'
    : `<span class="${r.tasa_falsos_positivos_pct >= 50 ? 'hal' : ''}">${r.tasa_falsos_positivos_pct}%</span>`;
  const filas = (d.resultados || []).map(r => {
    const meta = (d.reglas || []).find(x => x.id === r.id) || {};
    return `<tr title="${esc(meta.descripcion || '')}">
      <td>${esc(r.id)}</td>
      <td>${esc(r.nombre)}</td>
      <td>${esc(meta.severidad || '')}</td>
      <td class="run">${esc(meta.ttp || '')}</td>
      <td class="num">${(r.dispara_en || []).length}</td>
      <td class="num">${(r.en_benignas || []).length}</td>
      <td class="num">${fp(r)}</td>
      <td class="num">${(r.en_sospechosas || []).length}</td>
    </tr>`;
  }).join('');
  const conteo = d.conteo_etiquetas || {};
  const etiquetas = Object.entries(conteo).map(([k, v]) => `<span class="tag">${esc(k)}: ${v}</span>`).join(' ');
  cont.innerHTML = `
    <div class="box" style="margin-bottom:10px">
      <div class="k">calidad de los datos — leer antes que las tasas</div>
      <div style="margin-top:6px">
        base benigna: <b>${d.base_benigna}</b> corrida(s) ·
        sin atribución de ruta: <b>${c.corridas_sin_atribucion_de_ruta ?? '—'}</b> ·
        sin tarea evaluada: <b>${c.corridas_sin_tarea_evaluada ?? '—'}</b>
      </div>
      <div class="sub" style="margin-top:6px">${esc(c.nota || '')}</div>
      <div style="margin-top:8px">${etiquetas}</div>
    </div>
    <table>
      <thead><tr><th>id</th><th>regla</th><th>severidad</th><th>TTP</th>
        <th class="num">dispara</th><th class="num">en benignas</th><th class="num">FP</th>
        <th class="num">en sospechosas</th></tr></thead>
      <tbody>${filas || '<tr><td colspan="8" class="vacio">sin reglas</td></tr>'}</tbody>
    </table>
    <div class="sub" style="margin-top:8px">
      Las etiquetas son conductuales, derivadas del registro del host, no verdad de intención.
      R3 y R6 disparan sobre el 100% de la base benigna: la conducta que el experimento mide es
      indistinguible de la que un detector marcaría. Con una base benigna de ${d.base_benigna},
      eso es indicativo, no medido.
    </div>`;
}

(async function init() {
  CORPUS = await (await fetch('/api/corpus')).json();
  CORPUS.sort((a, b) => (b.ventana?.desde || 0) - (a.ventana?.desde || 0));
  const tareas = [...new Set(CORPUS.map(f => f.tarea))].sort();
  document.getElementById('ftarea').innerHTML =
    '<option value="">todas las tareas</option>' + tareas.map(t => `<option>${esc(t)}</option>`).join('');
  document.getElementById('ftarea').addEventListener('change', refrescar);
  document.getElementById('fbuscar').addEventListener('input', refrescar);
  refrescar();
  cargarReglas();
})();
</script>
</body>
</html>
